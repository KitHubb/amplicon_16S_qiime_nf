name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primer-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '26.04.2'
      - name: Run primer and all-container smoke tests with automatic image download
        run: >-
          nextflow run . -profile test,docker
          -params-file params/examples/custom_primers.yml
          --primer_f ACGTACGTACGT
          --outdir results/primer-test
      - name: Verify outputs from all four containers
        run: python3 tests/check_containers.py results/primer-test
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primer-test-diagnostics
          include-hidden-files: true
          path: |
            .nextflow.log
            results/primer-test/
            work/**/.command.*

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: primer-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
